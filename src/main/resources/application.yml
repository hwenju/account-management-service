spring:
  datasource:
    url: jdbc:h2:mem:bankdb
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # use Simple for the home task, can also be switched to Caffeine or Redis.
  cache:
    type: simple
    cache-names: account, account-pages

server:
  port: 8080

logging:
  level:
    com.mybank.account: INFO